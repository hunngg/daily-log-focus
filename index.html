<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><meta name="theme-color" content="#f5f5f2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Daily Log"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v3.png"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v3.png"><title>Daily Log</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#242a29;background:#f5f5f2}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;padding: max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(60px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}header{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{background:#e0e9e3;padding:12px;border-radius:15px;font-size:24px}h1{font-size:22px;margin:0}small,.muted{color:#78817d}h2{font-size:19px}.panel{background:white;border:1px solid #e6e9e5;border-radius:20px;padding:20px;margin-bottom:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f5f7f5;border-radius:14px;padding:14px}.stat strong{display:block;font-size:28px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px;background:#e9eeeb;color:#26332d;text-align:left}button.primary{background:#305b49;color:white;text-align:center;width:100%;font-weight:600}button.secondary{background:#eef1ee;text-align:center;width:100%}button.tile{min-height:100px;display:flex;flex-direction:column;justify-content:space-between;font-weight:600}.tile span{font-size:24px}p{line-height:1.7}textarea{width:100%;min-height:100px;border:1px solid #d9dfd9;border-radius:12px;padding:12px;font:inherit;font-size:16px;resize:vertical}input[type=range]{width:100%}.hidden{display:none!important}.back{background:transparent;padding:8px 0;margin-bottom:8px}.hint{background:#f0f4f0;padding:14px;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.quiet{font-size:13px;color:#78817d}.timer{font-size:46px;font-weight:700;text-align:center;letter-spacing:2px;margin:22px 0}.actions{display:grid;gap:10px}.bar{height:9px;background:#e6eae6;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#618d74;width:0}.footer{margin-top:30px;text-align:center;font-size:12px;color:#818984}.danger{color:#a44747}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{text-align:center;padding:10px 0;background:#f1f3f0;border-radius:8px;font-size:12px}.day.active{background:#cfe4d5}.subtle{font-size:12px;color:#777}label{display:block;margin:15px 0 7px;font-weight:600}</style></head><body><main class="app"><header><div class="logo">▥</div><div><h1>Daily Log</h1><small>Focus & Routine</small></div></header><p id="storageNotice" class="hint hidden" role="status">目前無法儲存本機資料；重新載入後，計時與練習紀錄可能遺失。</p><section id="home"><div class="panel"><div class="muted">今日概況</div><div class="stats" style="margin-top:12px"><div class="stat">已完成緩衝<strong id="today">0</strong></div><div class="stat">累積練習<strong id="total">0</strong></div></div></div><div class="panel"><h2>重新整理注意力</h2><p class="muted">選擇現在的狀態，花一點時間重新決定下一步。</p><div class="grid" id="tiles"></div></div><div class="panel"><div class="row"><h2>最近 14 天</h2><button id="clear" class="quiet" style="background:transparent">清除紀錄</button></div><div class="days" id="days"></div><p class="quiet">只記錄完成的緩衝練習，不追蹤任何人的訊息或回覆。</p></div></section><section id="exercise" class="hidden"><button class="back" id="back">← 返回</button><div class="panel"><h2 id="modeTitle"></h2><p id="tip" class="hint"></p><label for="intensity">目前感受強度：<span id="level">5</span> / 10</label><input type="range" min="0" max="10" value="5" id="intensity"><label for="draft">暫時寫下想法（選填）</label><textarea id="draft" placeholder="只在這次練習中顯示，離開後即清除。"></textarea><p class="quiet">文字不會送出，也不會儲存到手機或伺服器。</p><p id="action" class="muted"></p><button class="primary" id="start">開始 10 分鐘緩衝</button></div></section><section id="waiting" class="hidden"><button class="back" id="backWait">← 返回首頁</button><div class="panel"><h2>專注緩衝中</h2><p class="muted">暫時離開聊天畫面。可以去喝水、散步、洗澡，或處理一件小事。</p><div class="timer" id="clock" role="timer" aria-label="緩衝剩餘時間">10:00</div><div class="bar"><div id="progress"></div></div><p class="quiet">關閉頁面後仍可依開始時間計算剩餘時間；不會發出通知。</p><div class="actions"><button class="primary" id="finish">我已完成緩衝</button><button class="secondary" id="extend">再延後 10 分鐘</button><button class="secondary" id="exit">先離開</button></div></div></section><div class="footer">本機習慣紀錄 · 無帳號 · 無通知 · 不收集聯絡人</div></main><script>const MODES=[['send','↗','想主動聯絡','想聯絡是一種感受，不是必須立刻採取的行動。','先延後 10 分鐘，離開聊天視窗。'],['check','◷','想查看回覆','反覆查看不會改變對方何時回覆。','先做一件日常小事，再決定是否需要查看。'],['work','▤','想延續聊天','保持自然友善的工作互動，不必刻意延長話題。','把注意力放回目前的工作任務。'],['think','◌','反覆想起某人','可以察覺這個念頭，而不繼續推演對方的想法。','辨認想法後，回到眼前的事情。'],['sad','◇','感到失落','可以懷念以前的互動，也尊重現在的距離。','先照顧自己的情緒，不急著尋求回應。']];const KEY='dailylog.v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{records:[]}}catch{data={records:[]}}if(!data||typeof data!=='object')data={records:[]};if(!Array.isArray(data.records))data.records=[];data.records=data.records.filter(x=>x&&typeof x.day==='string'&&typeof x.mode==='string').map(x=>({day:x.day,mode:x.mode}));let selected=null,deadline=0,ticker=null,recorded=false;const $=id=>document.getElementById(id);function storageError(){$('storageNotice').classList.remove('hidden')}function save(){try{localStorage.setItem(KEY,JSON.stringify({records:data.records}))}catch{storageError()}}const TIMER_KEY='dailylog.timer.v1';function saveTimer(){try{localStorage.setItem(TIMER_KEY,JSON.stringify({deadline,mode:selected?.[0]}))}catch{storageError()}}function cancelTimer(){clearInterval(ticker);deadline=0;try{localStorage.removeItem(TIMER_KEY)}catch{storageError()}}function runTimer(){show('waiting');tick();clearInterval(ticker);if(deadline>Date.now())ticker=setInterval(tick,1000)}function localDay(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function show(id){['home','exercise','waiting'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='home'){$('draft').value='';render()}}function render(){let day=localDay();$('today').textContent=data.records.filter(x=>x.day===day).length;$('total').textContent=data.records.length;$('days').innerHTML='';for(let i=13;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let day=localDay(d),n=data.records.filter(x=>x.day===day).length;let el=document.createElement('div');el.className='day'+(n?' active':'');el.textContent=`${d.getMonth()+1}/${d.getDate()}${n?' · '+n:''}`;$('days').append(el)}}MODES.forEach(m=>{let b=document.createElement('button');b.className='tile';b.innerHTML=`<span>${m[1]}</span>${m[2]}`;b.onclick=()=>{selected=m;$ ('modeTitle').textContent=m[2];$('tip').textContent=m[3];$('action').textContent=m[4];$('intensity').value=5;$('level').textContent='5';show('exercise')};$('tiles').append(b)});$('intensity').oninput=e=>$('level').textContent=e.target.value;$('back').onclick=()=>show('home');$('backWait').onclick=()=>{cancelTimer();show('home')};$('start').onclick=()=>{deadline=Date.now()+600000;recorded=false;$('draft').value='';saveTimer();runTimer()};function tick(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;$('progress').style.width=`${Math.max(0,Math.min(100,(1-left/600)*100))}%`;$('finish').disabled=left>0;$('finish').style.opacity=left>0?'0.5':'1';if(left===0)clearInterval(ticker)}$('finish').onclick=()=>{if(Date.now()<deadline){alert('緩衝時間尚未結束。你可以繼續等待，或選擇先離開。');return}if(!recorded){data.records.push({day:localDay(),mode:selected?.[0]||'unknown'});save();recorded=true}cancelTimer();show('home')};$('extend').onclick=()=>{deadline=Date.now()+600000;saveTimer();runTimer()};$('exit').onclick=()=>{cancelTimer();show('home')};$('clear').onclick=()=>{if(confirm('確定清除所有練習紀錄？此操作無法復原。')){data={records:[]};save();render()}};render();try{localStorage.setItem('dailylog.storage-check','1');localStorage.removeItem('dailylog.storage-check');const active=JSON.parse(localStorage.getItem(TIMER_KEY));if(active&&Number.isFinite(active.deadline)&&MODES.some(m=>m[0]===active.mode)){deadline=active.deadline;selected=MODES.find(m=>m[0]===active.mode);runTimer()}}catch{storageError()}document.addEventListener('visibilitychange',()=>{if(document.hidden){$('draft').value=''}else if(deadline){runTimer()}});window.addEventListener('pagehide',()=>{$('draft').value=''});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
